name: Deploy to github pages
on:
    push:
        branches: ["**"]
    delete:

concurrency:
    group: pages-${{ github.event_name == 'delete' && github.event.ref_type || 'branch' }}-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    build-and-deploy-to-github-pages:
        if: github.event_name == 'push' && !github.event.deleted
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: "recursive"
                  lfs: true

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install and Build
              run: |
                  npm ci
                  npm run build

            - name: Check build size
              # 1GB = 1073741824 bytes
              run: |
                  SIZE=$(du -s -B 1 dist/ | cut -f 1)
                  if [[ $SIZE -gt 1073741824 ]]; then echo 'dist folder exceeds limit of 1GB! Aborting'; exit 1; fi

            - name: Deploy to Khronos repo
              if: github.actor != 'dependabot[bot]' && !startsWith(github.ref_name, 'dependabot/')
              uses: JamesIves/github-pages-deploy-action@v4.9.0
              with:
                  branch: main
                  folder: dist/
                  token: ${{ secrets.BUILD_GITHUB_PAGES }}
                  repository-name: KhronosGroup/glTF-Sample-Viewer-Release
                  target-folder: ${{ github.ref_name == 'main' && 'docs' || format('docs/preview/{0}', github.ref_name) }}
                  clean-exclude: |
                      docs/glxf
                      glxf
                      interactivity
                      physics
                      scatter
                      gaussian-splatting
                      preview

    remove-branch-preview:
        if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout deployment repository
              uses: actions/checkout@v7
              with:
                  repository: KhronosGroup/glTF-Sample-Viewer-Release
                  ref: main
                  token: ${{ secrets.BUILD_GITHUB_PAGES }}

            - name: Remove branch preview
              env:
                  BRANCH: ${{ github.event.ref }}
              run: |
                  git check-ref-format --branch "$BRANCH"
                  git rm -r --ignore-unmatch -- "docs/preview/$BRANCH"
                  if git diff --cached --quiet; then
                      echo "No preview found for branch $BRANCH"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Remove preview for deleted branch $BRANCH"
                  for attempt in 1 2 3; do
                      if git push origin HEAD:main; then
                          exit 0
                      fi
                      if [ "$attempt" -lt 3 ]; then
                          git pull --rebase origin main
                      fi
                  done
                  echo "::error::Failed to push preview removal after 3 attempts"
                  exit 1
